plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
}

android {
    namespace 'org.intelehealth.ncd'
    compileSdk 35

    defaultConfig {
        minSdk 26
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildFeatures {
        viewBinding true
        dataBinding true
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    packagingOptions {
        resources {
            excludes += [
                    'META-INF/ASL-2.0.txt',
                    'META-INF/LGPL-3.0.txt',
                    'META-INF/LICENSE*',
                    'META-INF/NOTICE*'
            ]
        }
    }
}

dependencies {
    // Core AndroidX
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity:1.10.1'

    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // Coroutines
    def coroutines_version = "1.7.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"

    // Lifecycle
    def lifecycle_version = "2.7.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-common:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"

    // Room
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    // Gson
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"

    // Joda-Time
    implementation 'joda-time:joda-time:2.10.9'

    // FlexBox
    implementation 'com.google.android.flexbox:flexbox:3.0.0'

    // FHIR SDK - AAR dependencies
//    implementation(name: 'common-0.1.0-alpha05-build_16294515623', ext: 'aar')
//    implementation(name: 'data-capture-1.3.0-build_16294515623', ext: 'aar')
//    implementation(name: 'engine-1.2.0-build_16294515623', ext: 'aar')
//    implementation(name: 'knowledge-0.1.0-beta01-build_16294515623', ext: 'aar')
//    implementation(name: 'workflow-0.1.0-beta01-build_16294515623', ext: 'aar')

//    // Source: https://mvnrepository.com/artifact/com.google.android.fhir/data-capture
//    implementation("com.google.android.fhir:data-capture:1.3.1")
//    // Source: https://mvnrepository.com/artifact/com.google.android.fhir/engine
//    implementation("com.google.android.fhir:engine:1.2.0")
//    // Source: https://mvnrepository.com/artifact/com.google.android.fhir/knowledge
//    implementation("com.google.android.fhir:knowledge:0.1.0-beta01")
//    // Source: https://mvnrepository.com/artifact/com.google.android.fhir/common
//    runtimeOnly("com.google.android.fhir:common:0.1.0-alpha05")
//    // Source: https://mvnrepository.com/artifact/com.google.android.fhir/workflow
//    implementation("com.google.android.fhir:workflow:0.1.0-beta01")

    // build from their last release tag sdc-1.3.1
    implementation(name: 'engine-release', ext: 'aar')
    //implementation(name: 'datacapture-release-original', ext: 'aar')
    implementation(name: 'datacapture-release', ext: 'aar')
    implementation(name: 'workflow-release', ext: 'aar')
    implementation(name: 'knowledge-release', ext: 'aar')
    implementation(name: 'common-release', ext: 'aar')

    // Core Library Desugaring (fixes the build error)
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"

    implementation("ca.uhn.hapi.fhir:hapi-fhir-structures-r4:6.8.0")
    def guavaVersion = "32.1.3-android"
    implementation("com.google.guava:guava:$guavaVersion")
    implementation("ca.uhn.hapi.fhir:hapi-fhir-caching-guava:6.8.0")
    implementation("androidx.fragment:fragment-ktx:1.6.1")
    implementation 'com.jakewharton.timber:timber:5.0.1'

    implementation 'com.github.bumptech.glide:glide:4.14.2'
    implementation 'com.parse:parse-android:1.15.7'
    implementation 'com.google.firebase:firebase-crashlytics-ktx:19.4.4'
    // Jetpack Paging 3 for Kotlin + Room
    implementation "androidx.paging:paging-runtime:3.3.6"
    // Paging integration for Room
    implementation "androidx.room:room-paging:2.6.1"

}

