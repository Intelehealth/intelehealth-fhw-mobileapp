pluginManagement {
    includeBuild("$rootDir/react-native/node_modules/@react-native/gradle-plugin")


    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id("com.facebook.react.settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    def rnRoot = file("$rootDir/react-native")
    ex.autolinkLibrariesFromCommand(
            ["cmd", "/c", "npx", "@react-native-community/cli", "config"],
            rnRoot,
            settings.layout.rootDirectory.files(
                    new File(rnRoot, "yarn.lock"),
                    new File(rnRoot, "package-lock.json"),
                    new File(rnRoot, "package.json"),
                    new File(rnRoot, "react-native.config.js")
            )
    )
}

rootProject.name = "ida-hw-intelehealth-fhw-mobileapp"

includeBuild("$rootDir/react-native/node_modules/@react-native/gradle-plugin")

include(":app")
include(":ihutils")
include(":features:ondemand:klivekit")
include(":fcm")
include(":config")
include(":core")
include(":database")
include(":features:ondemand:abdm")