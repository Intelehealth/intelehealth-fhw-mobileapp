plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
}

// Contract between the app and the optional ABDM (ABHA) plugin module.
// The app depends only on this module; the implementation lives in
// :features:ondemand:abdm and is added per flavor (see app/whitelabel.gradle).
android {
    namespace 'org.intelehealth.abdm.api'
    compileSdk 36

    defaultConfig {
        minSdk 26
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    api 'androidx.appcompat:appcompat:1.7.1'
}
