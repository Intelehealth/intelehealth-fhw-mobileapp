plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
}

/*
 * The ABHA/ABDM contract: the types the host app and the :features:ondemand:abdm implementation
 * both see. The host depends on this module unconditionally, so it compiles whether or not a given
 * client build ships the implementation. Keep it free of UI, networking and DI so it stays cheap.
 */
android {
    namespace 'org.intelehealth.abdm.api'
    compileSdk 36

    defaultConfig {
        minSdk 26
        targetSdk 36
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // FragmentActivity / ActivityResultLauncher appear in the AbhaFeature signatures.
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.activity:activity-ktx:1.8.1'
}
